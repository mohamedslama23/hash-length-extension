- name: Map lab hostname to the web server
  lineinfile:
    path: /etc/hosts
    line: "{{ lab_server_ip }} {{ lab_hostname }}"

- name: Install build tools and OpenSSL headers
  apt:
    name: [gcc, libssl-dev, curl, python3]
    update_cache: yes

- name: Create lab directory
  file:
    path: /home/seed/hashlen
    state: directory
    owner: seed
    group: seed
    mode: '0755'

- name: Student key file
  copy:
    dest: /home/seed/hashlen/mykey.txt
    content: "{{ lab_student_uid }}:{{ lab_student_key }}\n"
    owner: seed
    group: seed
    mode: '0644'

- name: Captured SysAdmin request (Task 3)
  copy:
    dest: /home/seed/hashlen/captured_request.txt
    content: |
      # Intercepted request from the SysAdmin. The SysAdmin's MAC key is {{ lab_admin_key_len }} characters long.
      http://{{ lab_hostname }}/?{{ lab_admin_msg }}&mac={{ lab_admin_mac }}
    owner: seed
    group: seed
    mode: '0644'

- name: Example program and README
  copy:
    src: length_ext.c
    dest: /home/seed/hashlen/length_ext.c
    owner: seed
    group: seed
    mode: '0644'

- name: README
  template:
    src: README.txt.j2
    dest: /home/seed/hashlen/README.txt
    owner: seed
    group: seed
    mode: '0644'
